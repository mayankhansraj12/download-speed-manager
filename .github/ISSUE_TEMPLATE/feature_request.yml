name: Feature request
description: Suggest something new or a change to how something works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches and examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
