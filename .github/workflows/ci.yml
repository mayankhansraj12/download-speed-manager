# Continuous integration: every push to main and every pull request must pass before it can be merged.
# Builds made here have no update source, so testers can try them without them updating themselves.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet run --project windows/DSM.Tests/DSM.Tests.csproj -c Release

      - name: Check the release tool builds
        run: dotnet build windows/tools/ReleaseTool/ReleaseTool.csproj -c Release -nologo

      - name: Build installer, portable zip and extension
        shell: pwsh
        run: ./windows/build.ps1 -Version "0.0.${{ github.run_number }}" -SkipTests

      - name: Upload test build
        uses: actions/upload-artifact@v7
        with:
          name: test-build-${{ github.run_number }}
          path: dist/*
          retention-days: 14

  node:
    name: Node engine and browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The engine has no runtime dependencies, so nothing needs installing to test it.
      - name: Test the Node engine
        run: npm test

      - name: Check the extension
        run: |
          for f in extension/*.js; do node --check "$f"; done
          node -e "const m = JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8')); if (m.manifest_version !== 3) throw new Error('expected Manifest V3');"
