<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Download Speed Manager</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" width="24" height="24" alt="">
    <strong>Download Speed Manager</strong>
  </header>

  <p id="status" class="pill">Checking…</p>
  <p id="hint" class="muted hint" hidden></p>

  <section>
    <label class="switch"><span>Catch downloads from the browser</span><input type="checkbox" id="enabled"></label>
    <label class="switch"><span>Show “Download video” on videos</span><input type="checkbox" id="videoButton"></label>
  </section>

  <section>
    <h2>Video and audio on this page</h2>
    <ul id="media" class="media"></ul>
    <button id="links" class="wide">Download links from this page…</button>
  </section>

  <footer class="muted">
    Hold <kbd>Alt</kbd> while clicking a link to let the browser download it.
    <a href="#" id="options">Settings</a>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
