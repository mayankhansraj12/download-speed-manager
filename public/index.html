<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171d25" media="(prefers-color-scheme: dark)">
  <title>Download Speed Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 7v12m-5.5-5.5L16 19l5.5-5.5M9.5 25h13' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-connection="connecting">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5v10.5M7.5 10.5 12 15l4.5-4.5M6.5 19.5h11"/></svg>
      </span>
      <h1>Download Speed Manager</h1>
    </div>
    <div class="totals">
      <span id="total-speed">0 B/s</span>
      <span class="muted" id="total-active">0 active</span>
    </div>
  </header>

  <main>
    <form id="add-form" class="add-form" autocomplete="off">
      <label class="sr-only" for="add-url">Download URL</label>
      <input id="add-url" type="url" required placeholder="Paste a download link (http or https)…">
      <label class="field">
        <span>Connections</span>
        <select id="add-connections">
          <option>1</option><option>2</option><option>4</option><option selected>8</option><option>16</option><option>32</option>
        </select>
      </label>
      <button type="submit" class="primary">Download</button>
    </form>
    <p id="form-error" class="error" role="alert" hidden></p>

    <section class="settings" aria-label="Settings">
      <label class="field">
        <span>Speed limit (KB/s, 0 = unlimited)</span>
        <input id="set-limit" type="number" min="0" step="64" value="0">
      </label>
      <label class="field">
        <span>Simultaneous downloads</span>
        <input id="set-concurrent" type="number" min="1" max="16" value="3">
      </label>
      <label class="field grow">
        <span>Save to folder</span>
        <input id="set-dir" type="text" spellcheck="false">
      </label>
    </section>

    <section aria-labelledby="downloads-heading">
      <div class="list-head">
        <h2 id="downloads-heading">Downloads</h2>
        <span class="conn-state" id="connection-state" role="status">Connecting…</span>
      </div>
      <ul id="downloads" class="downloads"></ul>
      <div id="empty" class="empty" hidden>
        <svg class="empty-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 10 12 14.5 16.5 10M4.5 15v2.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V15"/></svg>
        <p class="empty-title">No downloads yet</p>
        <p class="empty-text">Paste a link above, or install the browser extension to catch downloads automatically.</p>
      </div>
    </section>
  </main>

  <template id="row-template">
    <li class="download">
      <div class="row-top">
        <span class="name"></span>
        <span class="status"></span>
      </div>
      <canvas class="map" height="12" role="progressbar" aria-valuemin="0" aria-valuemax="100"></canvas>
      <div class="row-bottom">
        <span class="sizes"></span>
        <span class="speed"></span>
        <span class="eta"></span>
        <span class="conns"></span>
        <span class="actions">
          <button type="button" data-action="pause">Pause</button>
          <button type="button" data-action="resume">Resume</button>
          <button type="button" data-action="cancel">Cancel</button>
          <button type="button" data-action="remove">Remove</button>
        </span>
      </div>
      <p class="row-error error" hidden></p>
    </li>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
